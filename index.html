<style>
  :root{
    --ink:#e9e2d0; --paper:#141311; --paper-raised:#1c1a17;
    --amber:#c98a2c; --amber-dim:#8a5f22; --tape:#3a3630;
    --ok:#6f9a5c; --danger:#b5533f; --muted:#8c8478;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, #201d19 0%, var(--paper) 55%);
    color:var(--ink); font-family:'IBM Plex Mono', monospace;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 100px;}
  header{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px dashed var(--tape);padding-bottom:14px;margin-bottom:6px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.5px;font-size:22px;text-transform:uppercase;margin:0;}
  h1 span{color:var(--amber);}
  .head-right{text-align:right;}
  .count{font-size:11px;color:var(--muted);}
  .who{font-size:10px;color:var(--amber-dim);text-decoration:underline;background:none;border:none;padding:2px 0;font-family:inherit;cursor:pointer;}
  .sync{font-size:9px;color:var(--muted);margin:6px 0 14px;display:flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}
  .dot.off{background:var(--danger);}

  .recorder{background:var(--paper-raised);border:1px solid var(--tape);border-radius:6px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px;position:relative;overflow:hidden;}
  .recorder::before{content:'REGISTRO DE VOZ';position:absolute;top:8px;left:12px;font-size:9px;letter-spacing:2px;color:var(--muted);}
  #mic-btn{width:84px;height:84px;border-radius:50%;border:3px solid var(--amber);background:transparent;color:var(--amber);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease, background .2s ease;margin-top:10px;}
  #mic-btn svg{width:32px;height:32px;fill:currentColor;}
  #mic-btn:active{transform:scale(0.94);}
  #mic-btn.listening{background:var(--amber);color:var(--paper);animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,138,44,0.45);}50%{box-shadow:0 0 0 14px rgba(201,138,44,0);}}
  .bars{display:flex;gap:3px;height:20px;align-items:flex-end;}
  .bars span{width:3px;background:var(--amber-dim);border-radius:2px;height:4px;}
  .bars.active span{animation:bar 0.9s ease-in-out infinite;background:var(--amber);}
  .bars span:nth-child(1){animation-delay:0s;} .bars span:nth-child(2){animation-delay:.1s;} .bars span:nth-child(3){animation-delay:.2s;} .bars span:nth-child(4){animation-delay:.3s;} .bars span:nth-child(5){animation-delay:.15s;}
  @keyframes bar{0%,100%{height:4px;}50%{height:20px;}}
  #transcript{font-size:13px;color:var(--muted);min-height:16px;text-align:center;max-width:90%;}
  #transcript.filled{color:var(--ink);}
  .hint{font-size:10px;color:var(--muted);text-align:center;max-width:280px;}

  #confirm{display:none;width:100%;margin-top:6px;gap:8px;flex-direction:column;}
  #confirm.show{display:flex;}
  #confirm input{background:var(--paper);border:1px solid var(--tape);color:var(--ink);padding:10px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  #confirm label{font-size:9px;letter-spacing:1.5px;color:var(--muted);margin-bottom:-4px;}
  .confirm-row{display:flex;gap:8px;}
  .confirm-row button{flex:1;}
  button.primary{background:var(--amber);color:var(--paper);border:none;padding:10px;border-radius:4px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.5px;}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--tape);padding:10px;border-radius:4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;}

  .photo-row{display:flex;align-items:center;gap:10px;}
  .photo-btn{border:1px dashed var(--tape);background:var(--paper);color:var(--muted);border-radius:4px;padding:10px;font-size:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace;flex:1;text-align:center;}
  .photo-preview{position:relative;width:48px;height:48px;border-radius:4px;overflow:hidden;flex-shrink:0;border:1px solid var(--tape);}
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-preview .rm{position:absolute;top:0;right:0;background:rgba(0,0,0,0.7);color:#fff;border:none;width:16px;height:16px;font-size:10px;cursor:pointer;line-height:1;}

  .search{display:flex;gap:8px;margin-bottom:16px;}
  .search input{flex:1;background:var(--paper-raised);border:1px solid var(--tape);color:var(--ink);padding:10px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .search input::placeholder{color:var(--muted);}
  .icon-btn{background:var(--paper-raised);border:1px solid var(--tape);color:var(--muted);border-radius:4px;padding:0 12px;cursor:pointer;font-size:14px;}

  .group{margin-bottom:20px;}
  .group-title{display:flex;align-items:center;gap:8px;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:13px;letter-spacing:1px;color:var(--amber);margin-bottom:8px;}
  .group-title::after{content:'';flex:1;height:1px;background:var(--tape);}

  .label{background:var(--paper-raised);border:1px solid var(--tape);border-left:4px solid var(--amber-dim);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .label .left{display:flex;align-items:center;gap:10px;min-width:0;}
  .label .thumb{width:38px;height:38px;border-radius:4px;object-fit:cover;flex-shrink:0;border:1px solid var(--tape);}
  .label .item{font-size:14px;color:var(--ink);}
  .label .meta{font-size:10px;color:var(--muted);margin-top:2px;}
  .label .actions{display:flex;gap:2px;flex-shrink:0;}
  .label button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;}
  .label button.edit-btn:hover{color:var(--amber);}
  .label button.del-btn:hover{color:var(--danger);}

  .empty{text-align:center;color:var(--muted);font-size:12px;padding:40px 20px;border:1px dashed var(--tape);border-radius:6px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .toast.error{background:var(--danger);}

  .menu-wrap{position:relative;}
  .menu-btn{background:var(--paper-raised);border:1px solid var(--tape);color:var(--muted);border-radius:4px;width:34px;height:34px;font-size:16px;cursor:pointer;}
  .menu{position:absolute;right:0;top:40px;background:var(--paper-raised);border:1px solid var(--tape);border-radius:6px;overflow:hidden;z-index:20;display:none;min-width:170px;}
  .menu.show{display:block;}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:10px 14px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .menu button:hover{background:var(--paper);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:40;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper-raised);border:1px solid var(--tape);border-radius:8px;padding:20px;max-width:340px;width:100%;}
  .modal h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:16px;color:var(--amber);margin:0 0 12px;}
  .modal p{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5;}
  .modal input{width:100%;background:var(--paper);border:1px solid var(--tape);color:var(--ink);padding:10px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Dónde<span>Guardé</span></h1>
    </div>
    <div class="head-right">
      <div class="count" id="count">0 objetos</div>
      <button class="who" id="who-btn">tú: —</button>
    </div>
  </header>
  <div class="sync"><div class="dot" id="sync-dot"></div><span id="sync-text">Conectando…</span></div>

  <div class="recorder">
    <button id="mic-btn" aria-label="Grabar">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div class="bars" id="bars"><span></span><span></span><span></span><span></span><span></span></div>
    <div id="transcript">Toca el micrófono y di, por ejemplo: "Guardé las llaves de repuesto en el cajón del recibidor"</div>
    <div class="hint" id="hint"></div>

    <div id="confirm">
      <label>OBJETO</label>
      <input id="f-item" type="text" placeholder="ej. llaves de repuesto">
      <label>DÓNDE ESTÁ</label>
      <input id="f-location" type="text" placeholder="ej. cajón del recibidor">
      <label>FOTO (OPCIONAL)</label>
      <div class="photo-row" id="photo-row">
        <button class="photo-btn" id="photo-btn" type="button">📷 Añadir foto</button>
      </div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none;">
      <div class="confirm-row">
        <button class="ghost" id="btn-cancel">Descartar</button>
        <button class="primary" id="btn-save">Guardar etiqueta</button>
      </div>
    </div>
  </div>

  <div class="search">
    <input id="search" type="text" placeholder="Buscar objeto o lugar…">
    <div class="menu-wrap">
      <button class="menu-btn" id="menu-btn">⋮</button>
      <div class="menu" id="menu">
        <button id="menu-export">⬇ Exportar copia</button>
        <button id="menu-import">⬆ Importar copia</button>
      </div>
    </div>
  </div>
  <input type="file" id="import-input" accept="application/json" style="display:none;">

  <div id="list"></div>
</div>

<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <h2>¿Cómo te llamas?</h2>
    <p>Para que se sepa quién guardó cada objeto cuando compartas esta app con alguien más.</p>
    <input id="name-input" type="text" placeholder="Tu nombre">
    <button class="primary" id="name-save" style="width:100%;">Continuar</button>
  </div>
</div>

<div class="toast" id="toast">Guardado</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAA5kFs3pL6hQe5_ZmCPr0-tB_gky7vxjU",
  authDomain: "donde-guarde.firebaseapp.com",
  projectId: "donde-guarde",
  storageBucket: "donde-guarde.firebasestorage.app",
  messagingSenderId: "142517413514",
  appId: "1:142517413514:web:1ce3055897480fe5c46f73"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const col = db.collection('objetos');

let items = [];
let editingId = null;
let pendingPhoto = null;

// --- Nombre de usuario ---
function getAuthor(){ return localStorage.getItem('dg_author') || ''; }
function setAuthor(name){ localStorage.setItem('dg_author', name); document.getElementById('who-btn').textContent = 'tú: ' + name; }
if(getAuthor()){ document.getElementById('who-btn').textContent = 'tú: ' + getAuthor(); }
else{ document.getElementById('name-modal').classList.add('show'); }

document.getElementById('name-save').addEventListener('click', () => {
  const v = document.getElementById('name-input').value.trim();
  if(!v) return;
  setAuthor(v);
  document.getElementById('name-modal').classList.remove('show');
});
document.getElementById('who-btn').addEventListener('click', () => {
  document.getElementById('name-input').value = getAuthor();
  document.getElementById('name-modal').classList.add('show');
});

// --- Firestore real-time sync ---
col.orderBy('ts', 'desc').onSnapshot(
  (snapshot) => {
    items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('sync-dot').classList.remove('off');
    document.getElementById('sync-text').textContent = 'Sincronizado';
    render();
  },
  (err) => {
    document.getElementById('sync-dot').classList.add('off');
    document.getElementById('sync-text').textContent = 'Sin conexión con la base de datos compartida';
  }
);

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

async function saveEntry(item, location, photo){
  const data = { item: item.trim(), location: location.trim(), photo: photo || null, author: getAuthor() || 'Alguien' };
  try{
    if(editingId){
      await col.doc(editingId).update(data);
      showToast('Actualizado');
    }else{
      data.ts = Date.now();
      await col.add(data);
      showToast('Guardado');
    }
  }catch(e){
    showToast('Error al guardar', true);
  }
}

async function deleteItem(id){
  try{ await col.doc(id).delete(); }
  catch(e){ showToast('Error al borrar', true); }
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = items.filter(i => !q || i.item.toLowerCase().includes(q) || i.location.toLowerCase().includes(q));
  document.getElementById('count').textContent = items.length + (items.length===1 ? ' objeto' : ' objetos');

  const list = document.getElementById('list');
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">${items.length===0 ? 'Aún no hay objetos guardados.<br>Graba la primera nota de voz arriba.' : 'Sin resultados para esa búsqueda.'}</div>`;
    return;
  }
  const groups = {};
  filtered.forEach(i => { const loc = i.location || 'Sin lugar especificado'; (groups[loc] = groups[loc]||[]).push(i); });

  let html = '';
  Object.keys(groups).forEach(loc => {
    html += `<div class="group"><div class="group-title">${escapeHtml(loc)}</div>`;
    groups[loc].forEach(i => {
      const d = new Date(i.ts);
      const dateStr = d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'});
      const authorStr = i.author ? ` · ${escapeHtml(i.author)}` : '';
      html += `<div class="label">
        <div class="left">
          ${i.photo ? `<img class="thumb" src="${i.photo}">` : ''}
          <div>
            <div class="item">${escapeHtml(i.item)}</div>
            <div class="meta">${dateStr}${authorStr}</div>
          </div>
        </div>
        <div class="actions">
          <button data-id="${i.id}" class="edit-btn" aria-label="Editar">✎</button>
          <button data-id="${i.id}" class="del-btn" aria-label="Eliminar">✕</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', () => deleteItem(b.dataset.id)));
  list.querySelectorAll('.edit-btn').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.id)));
}

function openEdit(id){
  const it = items.find(i => i.id === id);
  if(!it) return;
  editingId = id;
  fItem.value = it.item;
  fLocation.value = it.location;
  pendingPhoto = it.photo || null;
  renderPhotoPreview();
  transcriptEl.textContent = 'Editando objeto existente';
  transcriptEl.classList.add('filled');
  confirmBox.classList.add('show');
  fItem.focus();
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- Parsing de voz en español ---
function parseSpeech(text){
  let t = text.trim();
  t = t.replace(/^(he\s+)?(guardado|guardé|puse|pongo|dejé|dejo|metí|meto)\s+/i, '');
  const connectors = /\s+(en|dentro de|debajo de|encima de|detrás de|sobre|junto a)\s+/i;
  const match = t.match(connectors);
  if(match){
    const idx = match.index;
    const item = t.slice(0, idx).trim();
    const location = t.slice(idx + match[0].length).trim();
    if(item && location) return {item, location};
  }
  return {item: t, location: ''};
}

// --- Reconocimiento de voz ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('mic-btn');
const bars = document.getElementById('bars');
const transcriptEl = document.getElementById('transcript');
const hintEl = document.getElementById('hint');
const confirmBox = document.getElementById('confirm');
const fItem = document.getElementById('f-item');
const fLocation = document.getElementById('f-location');

let recognition = null;
let listening = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    bars.classList.add('active');
    transcriptEl.textContent = 'Escuchando…';
    transcriptEl.classList.remove('filled');
    confirmBox.classList.remove('show');
    editingId = null;
    pendingPhoto = null;
  };
  recognition.onresult = (e) => {
    let text = '';
    for(let i=0;i<e.results.length;i++) text += e.results[i][0].transcript;
    transcriptEl.textContent = text;
    transcriptEl.classList.add('filled');
  };
  recognition.onerror = () => {
    hintEl.textContent = 'No se pudo escuchar bien. Puedes escribirlo abajo manualmente.';
    stopListening();
  };
  recognition.onend = () => {
    stopListening();
    const text = transcriptEl.textContent;
    if(text && text !== 'Escuchando…'){
      const {item, location} = parseSpeech(text);
      fItem.value = item;
      fLocation.value = location;
      renderPhotoPreview();
      confirmBox.classList.add('show');
    }
  };
  micBtn.addEventListener('click', () => {
    if(listening){ recognition.stop(); return; }
    try{ recognition.start(); }catch(e){}
  });
} else {
  hintEl.textContent = 'Tu navegador no soporta dictado por voz. Escribe el objeto y el lugar manualmente.';
  micBtn.addEventListener('click', () => {
    editingId = null; pendingPhoto = null;
    transcriptEl.textContent = 'Escribe abajo el objeto y dónde lo guardaste.';
    fItem.value = ''; fLocation.value = '';
    renderPhotoPreview();
    confirmBox.classList.add('show');
  });
}

function stopListening(){ listening = false; micBtn.classList.remove('listening'); bars.classList.remove('active'); }

// --- Fotos ---
const photoInput = document.getElementById('photo-input');
document.getElementById('photo-btn').addEventListener('click', () => photoInput.click());
photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 640;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h*maxDim/w; w = maxDim; }
      else if(h > maxDim){ w = w*maxDim/h; h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.6);
      renderPhotoPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = '';
});

function renderPhotoPreview(){
  const row = document.getElementById('photo-row');
  if(pendingPhoto){
    row.innerHTML = `<div class="photo-preview"><img src="${pendingPhoto}"><button class="rm" id="photo-rm">✕</button></div><button class="photo-btn" id="photo-btn2" type="button">📷 Cambiar</button>`;
    document.getElementById('photo-rm').addEventListener('click', () => { pendingPhoto = null; renderPhotoPreview(); });
    document.getElementById('photo-btn2').addEventListener('click', () => photoInput.click());
  }else{
    row.innerHTML = `<button class="photo-btn" id="photo-btn" type="button">📷 Añadir foto</button>`;
    document.getElementById('photo-btn').addEventListener('click', () => photoInput.click());
  }
}

// --- Guardar / cancelar ---
document.getElementById('btn-save').addEventListener('click', async () => {
  const item = fItem.value.trim();
  const location = fLocation.value.trim();
  if(!item){ fItem.focus(); return; }
  await saveEntry(item, location || 'Sin lugar especificado', pendingPhoto);
  resetForm();
});
document.getElementById('btn-cancel').addEventListener('click', resetForm);

function resetForm(){
  confirmBox.classList.remove('show');
  editingId = null; pendingPhoto = null;
  transcriptEl.textContent = 'Toca el micrófono y di, por ejemplo: "Guardé las llaves de repuesto en el cajón del recibidor"';
  transcriptEl.classList.remove('filled');
}

document.getElementById('search').addEventListener('input', render);

// --- Menú exportar / importar ---
const menuBtn = document.getElementById('menu-btn');
const menu = document.getElementById('menu');
menuBtn.addEventListener('click', () => menu.classList.toggle('show'));
document.addEventListener('click', (e) => { if(!menu.contains(e.target) && e.target !== menuBtn) menu.classList.remove('show'); });

document.getElementById('menu-export').addEventListener('click', () => {
  menu.classList.remove('show');
  const blob = new Blob([JSON.stringify(items, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'donde-guarde-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Copia descargada');
});

const importInput = document.getElementById('import-input');
document.getElementById('menu-import').addEventListener('click', () => { menu.classList.remove('show'); importInput.click(); });
importInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error('formato inválido');
      let count = 0;
      for(const entry of data){
        const payload = { item: entry.item || '', location: entry.location || '', photo: entry.photo || null, author: entry.author || 'Alguien', ts: entry.ts || Date.now() };
        if(!payload.item) continue;
        await col.add(payload);
        count++;
      }
      showToast(`Importados ${count} objetos`);
    }catch(err){
      showToast('Archivo de copia inválido', true);
    }
  };
  reader.readAsText(file);
  importInput.value = '';
});
</script>
